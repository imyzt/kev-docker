<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kev console — decision model test</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2333; --border:#2d3648;
    --fg:#e6edf3; --dim:#8b98ab; --acc:#58a6ff; --ok:#3fb950; --war:#d29922; --pur:#a371f7;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}
  header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;letter-spacing:.3px}
  header h1 .dot{color:var(--ok)}
  .badge{font:12px var(--mono);color:var(--dim);background:var(--panel2);border:1px solid var(--border);padding:3px 8px;border-radius:6px}
  .main{display:grid;grid-template-columns:300px minmax(340px,1fr) minmax(340px,1fr);gap:16px;padding:16px 20px;align-items:start}
  @media(max-width:1200px){.main{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){.main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .panel h2 .hint{font-size:11px;text-transform:none;letter-spacing:0;opacity:.7;font-weight:400}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
  textarea,input,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:7px 9px;font:13px var(--mono)}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .qcard{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
  .qcard .qhead{display:flex;gap:8px;margin-bottom:6px}
  .qcard .qhead input{flex:2}
  .qcard .qhead select{flex:1}
  .btn{background:var(--acc);color:#0d1117;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:13px}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--dim);padding:5px 10px;font-weight:400}
  .btn.danger{background:transparent;border:1px solid var(--border);color:#f47067;padding:4px 9px;font-weight:400}
  .btn:disabled{opacity:.5;cursor:wait}
  .toolbar{display:flex;gap:8px;align-items:center;margin-top:12px}
  .status{font:12px var(--mono);color:var(--dim)}
  .status.ok{color:var(--ok)} .status.err{color:#f47067}
  .anscard{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
  .anscard .id{font-family:var(--mono);font-size:12px;color:var(--acc)}
  .anscard .kv{font:12px var(--mono);color:var(--fg);margin:2px 0}
  .anscard .kv b{color:var(--dim);font-weight:400}
  .bar{display:flex;align-items:center;gap:8px;font:12px var(--mono);margin:3px 0}
  .bar .name{width:130px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
  .bar .track{flex:1;background:var(--border);border-radius:4px;height:12px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff);border-radius:4px}
  .bar .pct{width:52px;text-align:right;color:var(--fg);flex:none}
  .topline{font:12px var(--mono);color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:10px}
  #running{display:none;color:var(--war);font:12px var(--mono);margin-top:8px}
  .lang{display:flex;gap:2px;margin-left:auto;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .lang button{background:transparent;border:0;color:var(--dim);padding:4px 12px;cursor:pointer;font-size:12px}
  .lang button.on{background:var(--acc);color:#0d1117;font-weight:600}
  .tpl{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
  .tpl:hover{border-color:var(--acc)}
  .tpl.active{border-color:var(--acc);background:#101a2b}
  .tpl .tname{font-size:13px;font-weight:600}
  .tpl .tdesc{font-size:12px;color:var(--dim);margin-top:2px}
  .tpl .ttag{display:inline-block;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:4px;margin-top:5px}
  .ttag.ok{color:var(--ok);background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.35)}
  .ttag.exp{color:var(--war);background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.35)}
  .ttag.diy{color:var(--acc);background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35)}
  .note{font:11px var(--mono);color:var(--dim);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1><span class="dot">●</span> kev console <span data-i18n="hdrSub" style="color:var(--dim);font-weight:400">· decision model test (Jev-style)</span></h1>
  <span class="badge" id="miscBadge">…</span>
  <div class="lang">
    <button id="langEn">EN</button>
    <button id="langZh" class="on">中文</button>
  </div>
</header>
<div class="main">
  <!-- TEMPLATES -->
  <section class="panel">
    <h2><span data-i18n="secTemplates">Templates</span><span class="hint" data-i18n="secTemplatesHint">点卡片直接体验，无需自己设计问题</span></h2>
    <div id="gallery"></div>
    <div class="note" id="noteTpl"></div>
  </section>

  <!-- REQUEST BUILDER -->
  <section class="panel">
    <h2><span data-i18n="secRequest">Request</span> · <span data-i18n="secRequestPath">POST /v1/systemone</span></h2>
    <label data-i18n="lblState">state（JSON 对象 或 纯文本）</label>
    <textarea id="state" rows="6" spellcheck="false"></textarea>

    <label data-i18n="lblQuestions">questions</label>
    <div id="questions"></div>
    <button class="btn ghost" id="addQ">+ <span data-i18n="addQuestion">添加问题</span></button>

    <div class="toolbar">
      <button class="btn" id="run">▶ <span data-i18n="run">Run inference</span></button>
      <span class="status" id="status"></span>
    </div>
    <div id="running" data-i18n="running">推理中（CPU，约 1–2s）…</div>
  </section>

  <!-- RESPONSE -->
  <section class="panel">
    <h2><span data-i18n="secResponse">Response</span></h2>
    <div id="resp"><div class="status" id="respEmpty"></div></div>
  </section>
</div>

const MAX_OPTIONS = 255;

function startCustom() {
  currentTplId = null;
  const s = STARTER[lang] || STARTER.en;
  document.getElementById("state").value = s.state;
  metas = s.questions.map(q => ({ id: q.id, type: q.type, instructions: q.instructions, criteria: [...q.criteria] }));
  renderQuestions();
  [...document.querySelectorAll(".tpl")].forEach(c => c.classList.toggle("active", c.dataset.tpl === "DIY"));
  const status = document.getElementById("status");
  status.className = "status ok"; status.textContent = t("diyReady");
  if (window.innerWidth < 820) document.querySelector(".main .panel:nth-child(2)").scrollIntoView({ behavior: "smooth", block: "start" });
  else document.getElementById("state").focus();
}

function tplStateOf(tpl) {
  return lang === "zh" ? (tpl.state_zh ?? tpl.state) : tpl.state;
}
function tplQuestionsOf(tpl) {
  return lang === "zh" ? (tpl.zh_questions ?? tpl.questions) : tpl.questions;
}
function tplStateText(tpl) {
  const s = tplStateOf(tpl);
  return typeof s === "string" ? s : JSON.stringify(s, null, 2);
}
function pristineState(tpl) {
  return document.getElementById("state").value === tplStateText(tpl);
}
function pristineMetas(tpl) {
  const a = metas, b = tplQuestionsOf(tpl);
  if (a.length !== b.length) return false;
  return a.every((m, i) => m.id === b[i].id && m.type === b[i].type && m.instructions === b[i].instructions &&
    JSON.stringify(m.criteria || null) === JSON.stringify(b[i].criteria || null));
}

function loadTemplate(tpl) {
  currentTplId = tpl.id;
  document.getElementById("state").value = tplStateText(tpl);
  metas = tplQuestionsOf(tpl).map(q => ({ id: q.id, type: q.type, instructions: q.instructions, criteria: [...q.criteria] }));
  renderQuestions();
  [...document.querySelectorAll(".tpl")].forEach(c => c.classList.toggle("active", c.dataset.tpl === tpl.id));
  if (window.innerWidth < 820) document.querySelector(".main .panel:nth-child(2)").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderCriteria(meta) {
  const wrap = document.createElement("div");
  if (meta.type === "noul") {
    const mk = (ph) => {
      const r = document.createElement("div"); r.className = "row";
      const inp = document.createElement("input");
      inp.placeholder = ph;
      inp.value = meta.criteria[wrap.children.length] || "";
      inp.addEventListener("input", e => meta.criteria[wrap.children.length] = e.target.value);
      r.appendChild(inp); wrap.appendChild(r);
    };
    mk(t("noulTruePh")); mk(t("noulFalsePh"));
  } else {
    const ta = document.createElement("textarea");
    ta.rows = Math.min(6, (meta.criteria.length || 3) + 1);
    ta.placeholder = meta.type === "choice" ? t("critChoicePh") : t("critScorePh");
    ta.value = meta.criteria.join("\n");
    ta.addEventListener("input", e => {
      meta.criteria = e.target.value.split("\n").filter(l => l.trim() !== "" || meta.type === "score");
    });
    wrap.appendChild(ta);
  }
  return wrap;
}

function renderQuestions() {
  Q.innerHTML = "";
  metas.forEach(meta => Q.appendChild(makeQuestionCard(meta)));
}

function makeQuestionCard(meta) {
  const card = document.createElement("div"); card.className = "qcard";
  const head = document.createElement("div"); head.className = "qhead";
  const idIn = document.createElement("input"); idIn.value = meta.id; idIn.placeholder = t("idPh");
  idIn.addEventListener("input", e => meta.id = e.target.value.replace(/\s+/g, "_"));
  const type = document.createElement("select");
  ["choice", "noul", "score"].forEach(tv => {
    const o = document.createElement("option"); o.value = tv; o.text = tfn("chType", tv);
    type.appendChild(o);
  });
  type.value = meta.type;
  const remove = document.createElement("button"); remove.className = "btn danger"; remove.textContent = "✕"; remove.title = t("removeTitle");
  head.append(idIn, type, remove);
  card.appendChild(head);

  const instr = document.createElement("input");
  instr.value = meta.instructions; instr.placeholder = t("instrPh");
  instr.addEventListener("input", e => meta.instructions = e.target.value);
  card.appendChild(instr);

  let critWrap = renderCriteria(meta);
  const swap = () => { critWrap.remove(); critWrap = renderCriteria(meta); card.appendChild(critWrap); };
  type.addEventListener("change", () => { meta.type = type.value; swap(); });
  remove.addEventListener("click", () => { metas = metas.filter(m => m !== meta); card.remove(); });
  card.appendChild(critWrap);
  return card;
}

function addQuestion() {
  const meta = { id: "q" + (metas.length + 1), type: "choice", instructions: "", criteria: ["option_a", "option_b"] };
  metas.push(meta);
  Q.appendChild(makeQuestionCard(meta));
}
document.getElementById("addQ").addEventListener("click", addQuestion);

}

/* ---------- request builder ---------- */
function buildRequest() {
  const raw = document.getElementById("state").value.trim();
  let state;
  if (raw === "") throw new Error(t("stateEmpty"));
  if (raw[0] === "{" || raw[0] === "[") { try { state = JSON.parse(raw); } catch { throw new Error(t("stateBadJSON")); } }
  else state = raw;
  if (!state && state !== 0 && state !== "") throw new Error(t("stateBadJSON"));

  const questions = {};
  metas.forEach(meta => {
    const id = meta.id || "q";
    if (questions[id]) throw new Error(t("dupId") + id);
    const q = { type: meta.type, instructions: meta.instructions };
    if (meta.type === "choice") {
      const criteria = {};
      (meta.criteria || []).forEach(line => {
        if (!line || !String(line).trim()) return;
        const s = String(line);
        const idx = s.indexOf(":");
        const k = (idx >= 0 ? s.slice(0, idx) : s).trim();
        const v = idx >= 0 ? s.slice(idx + 1).trim() : "";
        if (!k) return;
        if (Object.keys(criteria).length >= MAX_OPTIONS) throw new Error(t("tooManyOpts"));
        criteria[k] = v || null;
      });
      if (Object.keys(criteria).length < 1) throw new Error(id + ": " + t("needChoice"));
      q.criteria = criteria;
    } else if (meta.type === "noul") {
      const c = {};
      if (meta.criteria[0]) c.true = meta.criteria[0];
      if (meta.criteria[1]) c.false = meta.criteria[1];
      q.criteria = Object.keys(c).length ? c : null;
    } else {
      const lv = (meta.criteria || []).filter(x => String(x).trim() !== "");
      if (lv.length < 2) throw new Error(id + ": " + t("needScore"));
      q.criteria = lv;
    }
    questions[id] = q;
  });
  if (Object.keys(questions).length === 0) throw new Error(t("noQuestions"));
  return { state, model: "kev-latest", questions };
}

/* ---------- response ---------- */
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function probBars(probs, legend) {
  const rows = [];
  let max = 1;
  Object.entries(probs).forEach(([, p]) => max = Math.max(max, p));
  Object.entries(probs).forEach(([k, p]) => {
    const name = legend ? legend[k] || k : k;
    const r = document.createElement("div"); r.className = "bar";
    r.append(el("span", "name", String(name).slice(0, 40)), el("span", "pct", (p * 100).toFixed(1) + "%"));
    const track = el("div", "track");
    const fill = el("div", "fill"); fill.style.width = (p / max * 100) + "%";
    track.appendChild(fill);
    r.insertBefore(track, r.lastChild);
    rows.push(r);
  });
  return rows;
}

function renderAnswer(id, a) {
  const card = el("div", "anscard");
  card.appendChild(el("div", "id", "# " + id + "  ·  " + a.type));
  Object.entries(a).forEach(([k, v]) => {
    if (k === "type" || k === "probabilities") return;
    const kv = el("div", "kv");
    const b = document.createElement("b"); b.textContent = k;
    kv.appendChild(b);
    kv.appendChild(document.createTextNode("  " + JSON.stringify(v)));
    card.appendChild(kv);
  });
  if (a.probabilities) probBars(a.probabilities, a.legend || null).forEach(x => card.appendChild(x));
  return card;
}

document.getElementById("run").addEventListener("click", async () => {
  const btn = document.getElementById("run");
  const status = document.getElementById("status");
  btn.disabled = true;
  document.getElementById("running").style.display = "block";
  status.className = "status"; status.textContent = "";
  try {
    const body = buildRequest();
    const t0 = performance.now();
    const res = await fetch("/v1/systemone", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
    });
    const wall = performance.now() - t0;
    const data = await res.json();
    if (!res.ok) {
      status.className = "status err";
      status.textContent = t("httpErr") + res.status + "：" + (data.detail ? JSON.stringify(data.detail).slice(0, 200) : "bad request");
      return;
    }
    const out = document.getElementById("resp");
    out.innerHTML = "";
    out.appendChild(el("div", "topline",
      I18N[lang].topline(data.model, data.latency_ms, wall.toFixed(0),
        data.usage ? data.usage.input_tokens : null, data.usage ? data.usage.output_tokens : null)));
    Object.entries(data.answers || {}).forEach(([id, a]) => out.appendChild(renderAnswer(id, a)));
    status.className = "status ok"; status.textContent = t("running_ok");
  } catch (e) {
    status.className = "status err"; status.textContent = t("netErr") + e.message;
  } finally {
    document.getElementById("running").style.display = "none";
    btn.disabled = false;
  }
});

/* ---------- i18n ---------- */
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("langZh").classList.toggle("on", lang === "zh");
  document.getElementById("langEn").classList.toggle("on", lang === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById("respEmpty").textContent = t("emptyResp");
  renderGallery();
  const tpl = currentTplId ? TEMPLATES.find(x => x.id === currentTplId) : null;
  if (tpl && pristineState(tpl) && pristineMetas(tpl)) loadTemplate(tpl); else renderQuestions();
  document.title = lang === "zh" ? "kev console — 决策模型测试台" : "kev console — decision model test";
}
document.getElementById("langEn").addEventListener("click", () => { lang = "en"; applyLang(); });
document.getElementById("langZh").addEventListener("click", () => { lang = "zh"; applyLang(); });

/* ---------- boot ---------- */
(async () => {
  const badge = document.getElementById("miscBadge");
  badge.textContent = t("env_loading");
  try {
    const r = await fetch("/v1/models");
    const d = await r.json();
    badge.textContent = d.models[0] ? d.models[0].run + "  ·  " + d.models[0].base : "";
  } catch (e) {
    badge.textContent = t("env_offline");
  }
  applyLang();
  loadTemplate(TEMPLATES[0]);
})();
</script>
